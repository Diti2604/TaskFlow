apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      # serviceAccountName: eks-secrets-manager
      containers:
      - name: fastapi
        image: 654654263428.dkr.ecr.us-east-1.amazonaws.com/fastapi-app:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000

