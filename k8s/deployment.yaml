apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      # serviceAccountName: secrets-manager-sa  
      containers:
        - name: fastapi
          image: 654654199927.dkr.ecr.us-east-1.amazonaws.com/fastapi-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
