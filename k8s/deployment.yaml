apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0       
      maxSurge: 1              
    type: RollingUpdate
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: fastapi
          image: 602643042505.dkr.ecr.us-east-1.amazonaws.com/fastapi-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet: { path: /, port: 8000 }
            failureThreshold: 6
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 2
          livenessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 5

          resources:
            requests:
              cpu: "100m"        
              memory: "128Mi"  
            limits:
              cpu: "500m"
              memory: "512Mi"
