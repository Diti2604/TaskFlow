<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Signup</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
      background: linear-gradient(135deg, #669469 0%, #017728 100%);
      min-height: 100vh;
      margin: 0;
      position: relative;
    }
    
    .container {
      max-width: 400px;
      margin: auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
    }
    
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 2rem;
      font-weight: 600;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      margin: 0.75rem 0;
      box-sizing: border-box;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }
    
    input:focus {
      outline: none;
      border-color: #0aad20;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #4dcf48 0%, #016f03 100%);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(5, 142, 30, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .toggle {
      text-align: center;
      margin-top: 1.5rem;
      color: #08a102;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .toggle:hover {
      color: #147503;
      text-decoration: none;
    }

    /* Enhanced Custom Alert Styles */
    .custom-alert {
      position: fixed;
      top: 20px;
      right: 20px;
      max-width: 400px;
      min-width: 320px;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transform: translateX(120%);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      backdrop-filter: blur(10px);
    }

    .custom-alert.show {
      transform: translateX(0);
      opacity: 1;
    }

    .custom-alert.success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .custom-alert.error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .custom-alert.info {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .alert-icon {
      font-size: 24px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .alert-content {
      flex-grow: 1;
    }

    .alert-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .alert-message {
      opacity: 0.95;
      font-size: 14px;
    }

    .alert-close {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .alert-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Loading state for button */
    .loading {
      opacity: 0.8;
      pointer-events: none;
      position: relative;
    }

    .loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Fade out animation */
    .custom-alert.fade-out {
      transform: translateX(120%);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login Page 12</h2>
    
    <form id="auth-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="submit-btn">Submit</button>
    </form>
    
    <div class="toggle" id="toggle-form">Don't have an account? Sign up</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
