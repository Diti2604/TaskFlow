name: CI/CD Pipeline
on:
  pull_request:
    branches: [ test ]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  K8S_DIR: k8s
  ECR_REPO: fastapi-app
  EKS_CLUSTER: cluster1
  K8S_NAMESPACE: default
  ENABLE_S3_ROLLBACK: "true"      
  ROLLOUT_TIMEOUT: "300s"         

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Import existing CloudFront OAC if needed
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          # Check if OAC exists in AWS but not in state
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='my-oac'].Id" --output text)
          if [ ! -z "$OAC_ID" ]; then
            echo "Found existing OAC: $OAC_ID"
            terraform import aws_cloudfront_origin_access_control.default-oac "$OAC_ID" || echo "Already in state or import failed"
          else
            echo "No existing OAC found, will create new one"
          fi

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "Terraform exit code: $code"
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Plan failed"; exit 1
          fi

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' && steps.plan.outputs.exit_code == '2' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Debug Helm releases on failure
        if: failure()
        run: |
          echo "=== Checking Helm releases ==="
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }} || echo "Could not update kubeconfig"
          helm list -A || echo "Could not list helm releases"
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller || echo "Could not get controller pods"

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: [terraform]
    outputs:
      alb_endpoint: ${{ steps.get_alb.outputs.alb_endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: push
        shell: bash
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          IMAGE_TAG="${GITHUB_SHA:0:12}"   # ADDED: shorter, cleaner tag

          docker build -t "${REPOSITORY_URI}:${IMAGE_TAG}" .
          docker push "${REPOSITORY_URI}:${IMAGE_TAG}"

          docker tag "${REPOSITORY_URI}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"
          docker push "${REPOSITORY_URI}:latest"

          echo "REPOSITORY_URI=${REPOSITORY_URI}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"

      - name: Read Terraform outputs (RDS)
        id: tf_rds
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -e
          terraform init -upgrade
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_SECRET_ARN=$(terraform output -raw rds_secret_arn)
          echo "rds_endpoint=${RDS_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "rds_secret_arn=${RDS_SECRET_ARN}" >> $GITHUB_OUTPUT

      - name: Validate RDS outputs
        run: |
          if [ -z "${{ steps.tf_rds.outputs.rds_endpoint }}" ] || [ -z "${{ steps.tf_rds.outputs.rds_secret_arn }}" ]; then
            echo "RDS outputs missing; aborting.";
            exit 1;
          fi

      - name: Create/Update K8s resources
        shell: bash
        run: |
          set -euo pipefail

          NS="${K8S_NAMESPACE}"
          SA_NAME="secrets-manager-sa"
          DEPLOY="fastapi-deployment"

          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create ns "${NS}"
          kubectl -n "${NS}" get sa "${SA_NAME}" >/dev/null 2>&1 || kubectl -n "${NS}" create sa "${SA_NAME}"

          kubectl -n "${NS}" apply -f k8s/service.yaml || true
          kubectl -n "${NS}" apply -f k8s/deployment.yaml || true

          kubectl -n "${NS}" set image "deployment/${DEPLOY}" fastapi="${REPOSITORY_URI}:${IMAGE_TAG}" --record=true
          kubectl -n "${NS}" set env "deployment/${DEPLOY}" \
            SECRET_NAME='${{ steps.tf_rds.outputs.rds_secret_arn }}' \
            DATABASE_HOST='${{ steps.tf_rds.outputs.rds_endpoint }}' \
            DB_NAME='database_1' \
            AWS_REGION='${{ env.AWS_REGION }}' \
            BOOTSTRAP_ON_START='true' \

          kubectl -n "$NS" set serviceaccount deployment/fastapi-deployment secrets-manager-sa
# FAIL_STARTUP=true
      - name: Wait for rollout
        id: wait_rollout             
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/fastapi-deployment" --timeout="${ROLLOUT_TIMEOUT}"

      - name: Get ALB endpoint from ingress
        id: get_alb
        run: |
          echo "Waiting for ALB endpoint to be provisioned..."
          for i in {1..30}; do
            ALB_ENDPOINT=$(kubectl -n "${K8S_NAMESPACE}" get ingress fastapi-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ ! -z "$ALB_ENDPOINT" ]; then
              echo "ALB endpoint found: $ALB_ENDPOINT"
              echo "alb_endpoint=${ALB_ENDPOINT}" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for ALB endpoint... attempt $i/30"
            sleep 10
          done
          if [ -z "$ALB_ENDPOINT" ]; then
            echo "Failed to get ALB endpoint after 5 minutes"
            exit 1
          fi

      - name: Information on why we got a failure
        if: failure()
        run: |
          echo "=== DESCRIBE DEPLOYMENT ==="
          kubectl -n "${K8S_NAMESPACE}" describe deployment/fastapi-deployment || true
          echo "=== PODS (label app=fastapi) ==="
          kubectl -n "${K8S_NAMESPACE}" get po -l app=fastapi -o wide || true

      - name: Roll back to previous ReplicaSet 
        if: failure()
        run: |
          echo "Rolling back fastapi-deployment…"
          kubectl -n "${K8S_NAMESPACE}" rollout undo deployment/fastapi-deployment
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/fastapi-deployment --timeout=180s || true
          echo "History after rollback:"
          kubectl -n "${K8S_NAMESPACE}" rollout history deployment/fastapi-deployment

  deploy-to-s3:
    runs-on: ubuntu-latest
    needs: [terraform, deploy-to-eks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend/my-react-app
        run: npm install

      - name: Set frontend build env (VITE_API_BASE)
        run: |
          ALB_ENDPOINT="${{ needs.deploy-to-eks.outputs.alb_endpoint }}"
          if [ -z "$ALB_ENDPOINT" ]; then
            echo "ERROR: ALB endpoint not available from deploy-to-eks job"
            exit 1
          fi
          echo "VITE_API_BASE=https://${ALB_ENDPOINT}" >> $GITHUB_ENV
          echo "Building frontend with API base: https://${ALB_ENDPOINT}"

      - name: Build project
        working-directory: frontend/my-react-app
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Getting Account ID
        id: build
        run: |
          set -e
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Read Terraform outputs (get S3 bucket)
        working-directory: ${{ env.TF_DIR }}
        id: tfoutputs
        run: |
          set -e
          terraform init -upgrade
          BUCKET_NAME=$(terraform output -raw site_bucket_name)
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_ENV

      - name: Sync files to S3
        run: |
          aws s3 sync frontend/my-react-app s3://$BUCKET_NAME --delete \
            --exclude "node_modules/*" \
            --exclude "package*.json" \
            --exclude ".git/*" \
            --exclude "public/*" \
            --exclude "src/*"
