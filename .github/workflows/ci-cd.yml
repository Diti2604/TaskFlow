name: CI/CD Pipeline
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  K8S_DIR: k8s
  ECR_REPO: fastapi-app      
  EKS_CLUSTER: cluster1 
  K8S_NAMESPACE: default  

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
   
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "Terraform exit code: $code"
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Plan failed"; exit 1
          fi


      - name: Terraform Apply
        if: ${{ github.event_name == 'push' && steps.plan.outputs.exit_code == '2' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan


  build-and-push:
    if: github.event_name == 'push'
    needs: terraform
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: build
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"

          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          docker tag "${IMAGE_URI}" "${REGISTRY}/${ECR_REPO}:latest"
          docker push "${REGISTRY}/${ECR_REPO}:latest"

          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT


  deploy:
    if: github.event_name == 'push'
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: cluster1
      K8S_NAMESPACE: default
      ECR_REPO: fastapi-app
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v3


      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Apply Deployment and Service
        id: img
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - name: Ensure deployment/service exist
        run: |
          kubectl apply  -n "$K8S_NAMESPACE" -f  k8s/deployment.yaml 
          kubectl apply  -n "$K8S_NAMESPACE" -f  k8s/service.yaml



         # kubectl -n "$K8S_NAMESPACE" get deploy/fastapi-deployment || kubectl apply -n "$K8S_NAMESPACE" -f k8s/deployment.yaml
          # kubectl -n "$K8S_NAMESPACE" get svc/fastapi-service || kubectl apply -n "$K8S_NAMESPACE" -f k8s/service.yaml
          # envsubst '${IMAGE_TAG}' < deployment.yaml > deployment-final.yaml


      # - name: Set image and roll out
      #   run: |
      #     kubectl -n "$K8S_NAMESPACE" set image deploy/fastapi-deployment fastapi=${{ steps.img.outputs.uri }}
          
