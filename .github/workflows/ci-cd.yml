name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  K8S_DIR: k8s
  ECR_REPO: fastapi-app      
  EKS_CLUSTER: cluster1 
  K8S_NAMESPACE: default  

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan (PRs)
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color

      - name: Terraform Apply (pushes)
        if: github.event_name == 'push'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -auto-approve

  build-and-push:
    if: github.event_name == 'push'
    needs: terraform
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: build
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"

          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          # (optional) also tag latest
          docker tag "${IMAGE_URI}" "${REGISTRY}/${ECR_REPO}:latest"
          docker push "${REGISTRY}/${ECR_REPO}:latest"

          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

  deploy:
    if: github.event_name == 'push'
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Set image in deployment.yaml
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" "${K8S_DIR}/deployment.yaml"

      - name: Apply manifests
        run: |
          kubectl apply -n "$K8S_NAMESPACE" -f "${K8S_DIR}/deployment.yaml"
          kubectl apply -n "$K8S_NAMESPACE" -f "${K8S_DIR}/service.yaml"
          kubectl apply -n "$K8S_NAMESPACE" -f "${K8S_DIR}/ingress.yaml"
          kubectl rollout status deployment/fastapi-deployment -n "$K8S_NAMESPACE"
