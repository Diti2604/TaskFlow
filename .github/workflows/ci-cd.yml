name: CI/CD Pipeline
on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ] 
env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  K8S_DIR: k8s
  ECR_REPO: fastapi-app
  EKS_CLUSTER: cluster1
  K8S_NAMESPACE: default
  ENABLE_S3_ROLLBACK: "true"      
  ROLLOUT_TIMEOUT: "300s"         

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "Terraform exit code: $code"
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Plan failed"; exit 1
          fi

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' && steps.plan.outputs.exit_code == '2' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        id: push
        shell: bash
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          IMAGE_TAG="${GITHUB_SHA:0:12}"   # ADDED: shorter, cleaner tag

          docker build -t "${REPOSITORY_URI}:${IMAGE_TAG}" .
          docker push "${REPOSITORY_URI}:${IMAGE_TAG}"

          docker tag "${REPOSITORY_URI}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"
          docker push "${REPOSITORY_URI}:latest"

          echo "REPOSITORY_URI=${REPOSITORY_URI}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"

      - name: Discover RDS endpoint & secret
        id: rds
        run: |
          DB_ID=database-1
          RDS_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].Endpoint.Address' --output text)
          SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
          echo "endpoint=${RDS_ENDPOINT}"   >> "$GITHUB_OUTPUT"
          echo "secret_arn=${SECRET_ARN}"   >> "$GITHUB_OUTPUT"

      - name: Create/Update K8s resources
        shell: bash
        run: |
          set -euo pipefail

          NS="${K8S_NAMESPACE}"
          SA_NAME="secrets-manager-sa"
          DEPLOY="fastapi-deployment"

          kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create ns "${NS}"
          kubectl -n "${NS}" get sa "${SA_NAME}" >/dev/null 2>&1 || kubectl -n "${NS}" create sa "${SA_NAME}"

          kubectl -n "${NS}" apply -f k8s/service.yaml || true
          kubectl -n "${NS}" apply -f k8s/deployment.yaml || true

          kubectl -n "${NS}" set image "deployment/${DEPLOY}" fastapi="${REPOSITORY_URI}:${IMAGE_TAG}" --record=true
          kubectl -n "${NS}" set env "deployment/${DEPLOY} FAIL_STARTUP=true" \
            SECRET_NAME='${{ steps.rds.outputs.secret_arn }}' \
            DATABASE_HOST='${{ steps.rds.outputs.endpoint }}' \
            DB_NAME='database_1' \
            AWS_REGION='${{ env.AWS_REGION }}' \
            BOOTSTRAP_ON_START='true'

          kubectl -n "$NS" set serviceaccount deployment/fastapi-deployment secrets-manager-sa

      - name: Wait for rollout
        id: wait_rollout             
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/fastapi-deployment" --timeout="${ROLLOUT_TIMEOUT}"

      - name: Information on why we got a failure
        if: failure()
        run: |
          echo "=== DESCRIBE DEPLOYMENT ==="
          kubectl -n "${K8S_NAMESPACE}" describe deployment/fastapi-deployment || true
          echo "=== PODS (label app=fastapi) ==="
          kubectl -n "${K8S_NAMESPACE}" get po -l app=fastapi -o wide || true

      - name: Roll back to previous ReplicaSet 
        if: failure()
        run: |
          echo "Rolling back fastapi-deployment…"
          kubectl -n "${K8S_NAMESPACE}" rollout undo deployment/fastapi-deployment
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/fastapi-deployment --timeout=180s || true
          echo "History after rollback:"
          kubectl -n "${K8S_NAMESPACE}" rollout history deployment/fastapi-deployment

  deploy-to-s3:
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend/my-react-app
        run: npm install

      - name: Build project
        working-directory: frontend/my-react-app
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Getting Account ID
        id: build
        run: |
          set -e
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Capture object versions before deployment
        if: ${{ env.ENABLE_S3_ROLLBACK == 'true' }}
        run: |
          BUCKET="my-tf-bucket-${{ env.ACCOUNT_ID }}-for-static-website-hosting"
          aws s3api list-object-versions --bucket "$BUCKET" --output json > pre_versions.json || echo '{}' > pre_versions.json

      - name: Sync files to S3
        run: aws s3 sync frontend/my-react-app s3://my-tf-bucket-${{ env.ACCOUNT_ID }}-for-static-website-hosting --delete --exclude "node_modules/*" --exclude "package*.json" --exclude ".git/*" --exclude "public/*" --exclude "src/*"
        env:
          S3_BUCKET_NAME: my-tf-bucket-${var.account_id}-for-static-website-hosting


      - name:  Roll back website to previous versions 
        if: ${{ env.ENABLE_S3_ROLLBACK == 'true' && failure() }}
        run: |
          BUCKET="my-tf-bucket-${{ env.ACCOUNT_ID }}-for-static-website-hosting"
          echo "Rolling back S3 objects using pre_versions.json…"
          python3 - << 'PY'
          import json, subprocess, os, sys
          bucket = "my-tf-bucket-{}-for-static-website-hosting".format(os.environ.get("ACCOUNT_ID",""))
          try:
              with open('pre_versions.json') as f:
                  data = json.load(f)
          except Exception as e:
              print("No snapshot available:", e)
              sys.exit(0)

          by_key = {}
          for v in data.get('Versions', []):
              key = v.get('Key')
              if not key: 
                  continue
              by_key.setdefault(key, []).append(v)

          for key, versions in by_key.items():
              versions.sort(key=lambda x: x.get('LastModified',''), reverse=True)
              ver = versions[0]
              src = f"{bucket}/{key}?versionId={ver['VersionId']}"
              print("Restoring", key, "->", ver['VersionId'])
              subprocess.run([
                  'aws','s3api','copy-object',
                  '--bucket', bucket,
                  '--key', key,
                  '--copy-source', src
              ], check=True)
          PY
          if [ -n "${{ env.CLOUDFRONT_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_ID }}" --paths "/*" || true
          fi
