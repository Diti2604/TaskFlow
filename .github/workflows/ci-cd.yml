name: CI/CD Pipeline
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  K8S_DIR: k8s
  ECR_REPO: fastapi-app      
  EKS_CLUSTER: cluster1 
  K8S_NAMESPACE: default  

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
   
      - name: Install jq 
        run: sudo apt-get update && sudo apt-get install -y jq
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "Terraform exit code: $code"
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Plan failed"; exit 1
          fi

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' && steps.plan.outputs.exit_code == '2' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan  

  build-and-deploy:
      runs-on: ubuntu-latest
      needs: [terraform]
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build & Push image
          id: push
          shell: bash
          run: |
            set -e
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
            IMAGE_TAG="${GITHUB_SHA}"

            docker build -t "${REPOSITORY_URI}:${IMAGE_TAG}" .
            docker push "${REPOSITORY_URI}:${IMAGE_TAG}"

            docker tag "${REPOSITORY_URI}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"
            docker push "${REPOSITORY_URI}:latest"

            echo "REPOSITORY_URI=${REPOSITORY_URI}" >> $GITHUB_ENV
            echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

        - name: Install kubectl
          uses: azure/setup-kubectl@v3

        - name: Update kubeconfig
          run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"

        - name: Discover RDS endpoint & secret
          id: rds
          run: |
            DB_ID=database-1
            RDS_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].Endpoint.Address' --output text)
            SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
            echo "endpoint=${RDS_ENDPOINT}"   >> "$GITHUB_OUTPUT"
            echo "secret_arn=${SECRET_ARN}"   >> "$GITHUB_OUTPUT"          
        - name: Create/Update K8s resources
          shell: bash
          run: |
            set -euo pipefail

            : "${REPOSITORY_URI:?Missing REPOSITORY_URI}"
            : "${IMAGE_TAG:?Missing IMAGE_TAG}"

            NS="${K8S_NAMESPACE}"

            kubectl get ns "${NS}" >/dev/null 2>&1 || kubectl create ns "${NS}"

            echo "== Service =="
            if ! kubectl -n "${NS}" get -f k8s/service.yaml >/dev/null 2>&1; then
              echo "Service not found; creating from k8s/service.yaml"
              kubectl -n "${NS}" apply -f k8s/service.yaml
            else
              echo "Service exists; applying any updates from k8s/service.yaml"
              kubectl -n "${NS}" apply -f k8s/service.yaml
            fi

            echo "== Deployment =="
            if ! kubectl -n "${NS}" get deploy fastapi-deployment >/dev/null 2>&1; then
              echo "Deployment not found; creating from k8s/deployment.yaml"
              kubectl -n "${NS}" apply -f k8s/deployment.yaml
            else
              echo "Deployment exists; updating image to ${REPOSITORY_URI}:${IMAGE_TAG}"
              kubectl -n "${NS}" set image deployment/fastapi-deployment fastapi="${REPOSITORY_URI}:${IMAGE_TAG}" --record=true
            fi

            echo "== Set env on Deployment =="
            kubectl -n "$NS" set env deployment/fastapi-deployment \
              SECRET_NAME='${{ steps.rds.outputs.secret_arn }}' \
              DATABASE_HOST='${{ steps.rds.outputs.endpoint }}' \
              DB_NAME='database_1' \
              AWS_REGION='${{ env.AWS_REGION }}'

              
            echo "== Rollout status =="
            kubectl -n "${NS}" rollout status deployment/fastapi-deployment --timeout=180s
   
  deploy-to-s3:
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend/my-react-app
        run: npm install

      - name: Build project
        working-directory: frontend/my-react-app
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Getting Account ID
        id: build
        run: |
            set -e
            echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Sync files to S3
        run: aws s3 sync frontend/my-react-app s3://my-tf-bucket-${{ env.ACCOUNT_ID }}-for-static-website-hosting --delete --exclude "node_modules/*" --exclude "package*.json" --exclude ".git/*" --exclude "public/*" --exclude "src/*"
        env:
          S3_BUCKET_NAME: my-tf-bucket-${var.account_id}-for-static-website-hosting



