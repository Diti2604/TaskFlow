name: CI/CD Pipeline - ECS
on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ test ]

env:
  AWS_REGION: us-east-1
  TF_DIR: infra
  ECR_REPO: fastapi-app
  ECS_CLUSTER: taskflow-cluster
  ECS_SERVICE: taskflow-api-service
  ENABLE_S3_ROLLBACK: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Package Lambda Functions
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Package ECS scheduler Lambda
          cd $GITHUB_WORKSPACE/$TF_DIR
          mkdir -p lambda_temp
          cp lambda_ecs_scheduler.py lambda_temp/index.py
          cd lambda_temp
          zip -r ../lambda_ecs_scheduler.zip index.py
          cd ..
          rm -rf lambda_temp
          ls -lh lambda_ecs_scheduler.zip

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Import existing CloudFront OAC if needed
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='my-oac'].Id" --output text)
          if [ ! -z "$OAC_ID" ]; then
            echo "Found existing OAC: $OAC_ID"
            terraform import aws_cloudfront_origin_access_control.default-oac "$OAC_ID" || echo "Already in state or import failed"
          else
            echo "No existing OAC found, will create new one"
          fi

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "Terraform exit code: $code"
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Plan failed"; exit 1
          fi

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' && steps.plan.outputs.exit_code == '2' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: [terraform]
    outputs:
      alb_endpoint: ${{ steps.get_alb.outputs.alb_endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        id: push
        shell: bash
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          IMAGE_TAG="${GITHUB_SHA:0:12}"

          echo "Building image..."
          docker build -t "${REPOSITORY_URI}:${IMAGE_TAG}" .
          
          echo "Pushing image with tag: ${IMAGE_TAG}"
          docker push "${REPOSITORY_URI}:${IMAGE_TAG}"

          echo "Tagging and pushing as latest..."
          docker tag "${REPOSITORY_URI}:${IMAGE_TAG}" "${REPOSITORY_URI}:latest"
          docker push "${REPOSITORY_URI}:latest"

          echo "REPOSITORY_URI=${REPOSITORY_URI}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_uri=${REPOSITORY_URI}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Get Current Task Definition
        id: get_task_def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --query 'services[0].taskDefinition' \
            --output text)
          
          echo "Current task definition: $TASK_DEF_ARN"
          echo "task_def_arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT

      - name: Download Current Task Definition
        id: download_task_def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.get_task_def.outputs.task_def_arn }} \
            --query 'taskDefinition' > task-definition.json
          
          cat task-definition.json

      - name: Update Task Definition with New Image
        id: update_task_def
        run: |
          # Extract current task def and update image
          jq --arg IMAGE "${{ steps.push.outputs.image_uri }}" \
             '.containerDefinitions[0].image = $IMAGE | 
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             task-definition.json > new-task-definition.json
          
          echo "New task definition:"
          cat new-task-definition.json

      - name: Register New Task Definition
        id: register_task_def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New task definition registered: $NEW_TASK_DEF_ARN"
          echo "new_task_def_arn=${NEW_TASK_DEF_ARN}" >> $GITHUB_OUTPUT

      - name: Update ECS Service
        id: update_service
        run: |
          echo "Updating ECS service to use new task definition..."
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${{ steps.register_task_def.outputs.new_task_def_arn }} \
            --force-new-deployment

      - name: Wait for Service Stability
        run: |
          echo "Waiting for service to become stable (up to 10 minutes)..."
          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE}
          
          echo "✓ Service is stable!"

      - name: Verify Running Tasks
        run: |
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --query 'services[0].runningCount' \
            --output text)
          
          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --query 'services[0].desiredCount' \
            --output text)
          
          echo "Running tasks: ${RUNNING_COUNT}/${DESIRED_COUNT}"
          
          if [ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]; then
            echo "Error: Not all tasks are running!"
            exit 1
          fi

      - name: Get ALB Endpoint
        id: get_alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names taskflow-ecs-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "ALB endpoint: $ALB_DNS"
          echo "alb_endpoint=${ALB_DNS}" >> $GITHUB_OUTPUT

      - name: Deployment Information
        if: always()
        run: |
          echo "=== ECS Service Status ==="
          aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Deployments:deployments}'
          
          echo "=== Recent Task Events ==="
          aws ecs describe-services \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE} \
            --query 'services[0].events[:5]'

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-to-ecs]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ALB Health Checks
        run: |
          echo "Waiting for ALB target health checks to pass..."
          sleep 30

          # Get target group ARN
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names ecs-taskflow-api-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          echo "Target Group: $TG_ARN"
          
          # Check target health
          for i in {1..12}; do
            HEALTHY=$(aws elbv2 describe-target-health \
              --target-group-arn $TG_ARN \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)
            
            TOTAL=$(aws elbv2 describe-target-health \
              --target-group-arn $TG_ARN \
              --query 'length(TargetHealthDescriptions)' \
              --output text)
            
            echo "Healthy targets: ${HEALTHY}/${TOTAL}"
            
            if [ "$HEALTHY" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "✓ All targets are healthy!"
              break
            fi
            
            if [ $i -eq 12 ]; then
              echo "✗ Targets did not become healthy in time"
              aws elbv2 describe-target-health --target-group-arn $TG_ARN
              exit 1
            fi
            
            sleep 10
          done

      - name: Test API Endpoint (via ALB)
        run: |
          echo "Testing API via ALB..."
          ALB_DNS="${{ needs.deploy-to-ecs.outputs.alb_endpoint }}"
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: api.taskflow.indritcloud.com" "http://${ALB_DNS}/" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✓ API is responding!"
              break
            fi
            
            if [ $i -eq 5 ]; then
              echo "✗ API did not respond successfully"
              exit 1
            fi
            
            sleep 5
          done

      - name: Test API Endpoint (via Domain)
        run: |
          echo "Testing API via domain..."
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.taskflow.indritcloud.com/" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              RESPONSE=$(curl -s "https://api.taskflow.indritcloud.com/")
              echo "Response: $RESPONSE"
              echo "✓ API is healthy!"
              break
            fi
            
            if [ $i -eq 5 ]; then
              echo "⚠ API via domain not responding yet (DNS propagation may take time)"
            fi
            
            sleep 10
          done

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [health-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: frontend/my-react-app
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        working-directory: frontend/my-react-app
        run: |
          S3_BUCKET=$(aws s3 ls | grep taskflow-s3-bucket | awk '{print $3}')
          echo "Deploying to S3 bucket: $S3_BUCKET"
          aws s3 sync dist/ s3://${S3_BUCKET}/ --delete

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, 'taskflow.indritcloud.com')].Id" \
            --output text)
          
          echo "Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id ${DISTRIBUTION_ID} \
            --paths "/*"

      - name: Deployment Summary
        if: always()
        run: |
          echo "=== Deployment Complete ==="
          echo "Frontend: https://taskflow.indritcloud.com"
          echo "API: https://api.taskflow.indritcloud.com"
          echo "ECS Cluster: ${ECS_CLUSTER}"
          echo "ECS Service: ${ECS_SERVICE}"
