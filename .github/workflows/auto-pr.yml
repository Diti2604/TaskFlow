permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ test ]

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true   # needed to push

      - name: Create ephemeral branch
        run: |
          git checkout -b "test-pr-${GITHUB_SHA}"
          git push origin "test-pr-${GITHUB_SHA}"

      - name: Open PR to master
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            await github.rest.pulls.create({
              owner, repo,
              head: `test-pr-${process.env.GITHUB_SHA}`,  // new branch
              base: 'master',
              title: 'Promote test → master',
              body: 'Automated PR from latest test push.'
            });
