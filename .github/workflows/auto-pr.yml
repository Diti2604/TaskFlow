# .github/workflows/auto-pr.yml
name: PR test → master (single rolling)
on:
  push:
    branches: [ test ]

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: true

      - name: Push test HEAD to fixed branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create/update a single branch named test-pr
          git push -f origin HEAD:test-pr

      - name: Open or update PR (test-pr → master)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const head = 'test-pr';
            const base = 'master';
            const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${head}`, base });
            if (prs.data.length) {
              const n = prs.data[0].number;
              await github.rest.pulls.update({ owner, repo, pull_number: n,
                title: 'Promote test → master',
                body:  'Rolling PR; auto-updated on each test push.' });
              core.info(`Updated PR #${n}`);
            } else {
              const created = await github.rest.pulls.create({ owner, repo, head, base,
                title: 'Promote test → master',
                body:  'Rolling PR; auto-opened by CI.' });
              core.info(`Created PR #${created.data.number}`);
            }
