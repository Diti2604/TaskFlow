name: PR test → master (gh CLI)

on:
  push:
    branches-ignore: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: test, fetch-depth: 0 }

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Ensure diff exists
        id: diffcheck
        run: |
          git fetch origin master
          if git diff --quiet origin/master...HEAD; then
            echo "nodiff=true" >> $GITHUB_OUTPUT
          else
            echo "nodiff=false" >> $GITHUB_OUTPUT
          fi

      - name: Open or update PR test → master
        if: steps.diffcheck.outputs.nodiff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuse existing PR if present; else create
          if gh pr list --base master --head test --state open --json number --jq 'length>0'; then
            num=$(gh pr list --base master --head test --state open --json number --jq '.[0].number')
            gh pr edit "$num" --title "Promote test → master" --body "Sync master with latest from test."
          else
            gh pr create --base master --head test \
              --title "Promote test → master" \
              --body  "Sync master with latest from test."
          fi
