name: Create PR from test to master
on:
  push:
    branches: [ test ]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Open or update PR test → master
        uses: peter-evans/create-pull-request@v7
        with:
          branch: test          
          base: master             
          title: "Promote test → master"
          body: "Sync master with latest from test."
          commit-message: "chore: promote test → master"
