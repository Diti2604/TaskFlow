name: Create production promotion pull request

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Reset promotion branch to master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: test-promotion   
          base: test               
          title: "Promote master → test"
          body: "Sync test with latest from master."
          commit-message: "chore: promote master → test"
