name: Auto PR from branch to master
on:
  push:
    branches:
      - '**'           # run on all branches

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4
      - name: Open or update PR to master
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # If blocked by policy, use a PAT secret instead
          script: |
            const { owner, repo } = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'master';

            const cmp = await github.rest.repos.compareCommits({ owner, repo, base, head });
            if (cmp.data.status === 'identical' || cmp.data.ahead_by === 0) {
              core.info(`No differences between ${head} and ${base}. Skipping PR.`);
              return;
            }

            // Reuse existing PR if open
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });
            if (existing.length) {
              core.info(`PR already open: #${existing[0].number}`);
              return;
            }

            const title = `Auto PR from ${head}`;
            const body  = `Auto-created from \`${head}\` to \`${base}\`.`;
            const { data: pr } = await github.rest.pulls.create({ owner, repo, head, base, title, body });
            core.info(`Created PR #${pr.number}`);
